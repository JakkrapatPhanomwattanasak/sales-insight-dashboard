[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "data-app"
version = "0.1.0"
description = "Runnable portfolio project with documented examples and tests"
requires-python = ">=3.11"
authors = [{name = "JakkrapatPhanomwattanasak", email = "Jakkrapat.phanom@gmail.com"}]
readme = "README.md"
dependencies = ["Flask>=3.1,<4","pandas>=2.2,<3","scikit-learn>=1.5,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_app = ["templates/*.html", "static/*", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
